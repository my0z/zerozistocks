name = "zerozistocks"
main = "worker.js"
compatibility_date = "2026-08-10"
keep_vars = true

[triggers]
crons = ["0 0-6 * * 1-5", "1 0-6 * * 1-5", "2 0-6 * * 1-5"]
# 0분: 신규 편입 발행(/run), 1분: 익절 리포트(/run-profits), 2분: 손절 리포트(/run-stoploss)
# KST 09:00~15:00 평일 매시

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "naver_sise"
database_id = "e4bd43bd-8692-45ad-8e99-28519cc78520"

[[kv_namespaces]]
binding = "ZEROZI_KV"
id = "93bd518185de46a0901f01d79f8ba731"

[ai]
binding = "AI"

[[analytics_engine_datasets]]
binding = "SIGNAL_ANALYTICS"
dataset = "kiwoomapi_signals"

# secrets (wrangler secret put 으로 개별 등록, toml에는 값 넣지 않음)
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# GOOGLE_REFRESH_TOKEN
# ZEROZI_BLOG_ID
